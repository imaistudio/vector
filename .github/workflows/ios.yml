name: iOS

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/ios/**'
      - 'scripts/prepare-ios-signing.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/ios/**'
      - 'scripts/prepare-ios-signing.mjs'
  workflow_dispatch:
    inputs:
      signed_archive:
        description: 'Build a signed iOS archive. Requires an app target and signing secrets.'
        required: true
        type: boolean
        default: false
      upload_testflight:
        description: 'Upload the exported IPA to TestFlight after archive export.'
        required: true
        type: boolean
        default: false
      workspace_path:
        description: 'Optional .xcworkspace path, if the app uses a workspace.'
        required: false
        type: string
        default: ''
      project_path:
        description: 'Xcode project path for the app target.'
        required: false
        type: string
        default: 'apps/ios/Vector.xcodeproj'
      scheme:
        description: 'Xcode scheme for the app target.'
        required: false
        type: string
        default: 'Vector'
      configuration:
        description: 'Xcode build configuration.'
        required: false
        type: string
        default: 'Release'
      bundle_id:
        description: 'App bundle identifier used in ExportOptions.plist.'
        required: false
        type: string
        default: 'studio.imai.vector'
      export_method:
        description: 'xcodebuild export method, e.g. app-store-connect, release-testing, enterprise, debugging.'
        required: false
        type: string
        default: 'app-store-connect'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift package tests
        run: swift test
        working-directory: apps/ios

      - name: Build Swift package for iOS Simulator
        run: xcodebuild -scheme VectorMobile -destination 'generic/platform=iOS Simulator' build
        working-directory: apps/ios

  signed-archive:
    name: Signed Archive
    if: github.event_name == 'workflow_dispatch' && inputs.signed_archive
    runs-on: macos-latest
    needs: package

    env:
      IOS_WORKSPACE: ${{ inputs.workspace_path }}
      IOS_PROJECT: ${{ inputs.project_path }}
      IOS_SCHEME: ${{ inputs.scheme }}
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      IOS_BUNDLE_ID: ${{ inputs.bundle_id }}
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate app target inputs
        run: |
          set -euo pipefail

          if [ -n "$IOS_WORKSPACE" ]; then
            if [ ! -d "$IOS_WORKSPACE" ]; then
              echo "Workspace not found: $IOS_WORKSPACE"
              exit 1
            fi
            xcodebuild -list -workspace "$IOS_WORKSPACE"
            exit 0
          fi

          if [ -z "$IOS_PROJECT" ]; then
            echo "Set either workspace_path or project_path."
            exit 1
          fi

          if [ ! -d "$IOS_PROJECT" ]; then
            echo "Xcode app project not found: $IOS_PROJECT"
            echo "The current iOS slice is still a Swift package. Add the app target before running signed archives."
            exit 1
          fi

          xcodebuild -list -project "$IOS_PROJECT"

      - name: Prepare iOS signing
        env:
          IOS_REQUIRE_SIGNING: '1'
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: node scripts/prepare-ios-signing.mjs

      - name: Build signed archive
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Vector.xcarchive"
          team_id="${APPLE_TEAM_ID:-${IOS_PROVISIONING_TEAM_ID:-}}"

          if [ -z "$team_id" ]; then
            echo "No Apple team ID found. Set APPLE_TEAM_ID or provide a provisioning profile with TeamIdentifier."
            exit 1
          fi

          container_args=()
          if [ -n "$IOS_WORKSPACE" ]; then
            container_args=(-workspace "$IOS_WORKSPACE")
          else
            container_args=(-project "$IOS_PROJECT")
          fi

          xcodebuild archive \
            "${container_args[@]}" \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$team_id" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_CODESIGN_IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_CODESIGN_KEYCHAIN"

      - name: Write export options
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const out = path.join(process.env.RUNNER_TEMP, 'ExportOptions.plist');
          const teamId = process.env.APPLE_TEAM_ID || process.env.IOS_PROVISIONING_TEAM_ID;
          const profile = process.env.IOS_PROVISIONING_PROFILE_NAME || process.env.IOS_PROVISIONING_PROFILE_UUID;
          const bundleId = process.env.IOS_BUNDLE_ID;

          if (!teamId) throw new Error('Missing Apple team ID for ExportOptions.plist');
          if (!profile) throw new Error('Missing provisioning profile name/UUID for ExportOptions.plist');
          if (!bundleId) throw new Error('Missing IOS_BUNDLE_ID for ExportOptions.plist');

          const escapeXml = (value) =>
            String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');

          const plist = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">',
            '<plist version="1.0">',
            '<dict>',
            '  <key>method</key>',
            `  <string>${escapeXml(process.env.IOS_EXPORT_METHOD || 'app-store-connect')}</string>`,
            '  <key>signingStyle</key>',
            '  <string>manual</string>',
            '  <key>teamID</key>',
            `  <string>${escapeXml(teamId)}</string>`,
            '  <key>provisioningProfiles</key>',
            '  <dict>',
            `    <key>${escapeXml(bundleId)}</key>`,
            `    <string>${escapeXml(profile)}</string>`,
            '  </dict>',
            '</dict>',
            '</plist>',
            '',
          ].join('\n');

          fs.writeFileSync(out, plist);
          fs.appendFileSync(process.env.GITHUB_ENV, `IOS_EXPORT_OPTIONS_PLIST=${out}\n`);
          NODE

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Vector.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PLIST"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vector-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Vector.xcarchive
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: inputs.upload_testflight
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_API_KEY_CONTENT:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER are required for TestFlight upload."
            exit 1
          fi

          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "No IPA found in $RUNNER_TEMP/export."
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          chmod 600 "$api_key_path"
          openssl pkey -in "$api_key_path" -noout >/dev/null

          xcrun altool --upload-app \
            --file "$ipa_path" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER" \
            --p8-file-path "$api_key_path" \
            --output-format normal

      - name: Job summary
        run: |
          {
            echo "## iOS signed archive"
            echo
            echo "- Scheme: \`$IOS_SCHEME\`"
            echo "- Configuration: \`$IOS_CONFIGURATION\`"
            echo "- Bundle ID: \`$IOS_BUNDLE_ID\`"
            echo "- Export method: \`$IOS_EXPORT_METHOD\`"
            echo "- TestFlight upload: \`${{ inputs.upload_testflight }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
